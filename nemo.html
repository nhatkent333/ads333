<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trắc Nghiệm Ôn Tập KHTN 6 - KTTX Lần 3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        .option-card:hover {
            border-color: #3b82f6;
            background-color: #eff6ff;
        }
        .correct {
            background-color: #d1fae5 !important;
            border-color: #10b981 !important;
        }
        .incorrect {
            background-color: #fee2e2 !important;
            border-color: #ef4444 !important;
        }
        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-3xl mx-auto">
        <!-- Header -->
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold text-blue-800">ÔN TẬP KHTN 6 - KTTX LẦN 3</h1>
            <p class="text-gray-600 mt-2">Chủ đề: Thực vật, Động vật và Năng lượng</p>
            <div id="progress-bar" class="w-full bg-gray-200 rounded-full h-2.5 mt-6">
                <div id="progress-fill" class="bg-blue-600 h-2.5 rounded-full transition-all duration-500" style="width: 0%"></div>
            </div>
            <p id="stats" class="text-sm text-gray-500 mt-2 font-semibold">Câu 1 / 20</p>
        </header>

        <!-- Quiz Container -->
        <div id="quiz-container" class="bg-white rounded-2xl shadow-xl p-6 md:p-10 mb-6 min-h-[400px]">
            <!-- Content will be injected here by JS -->
            <div id="question-box" class="fade-in">
                <h2 id="question-text" class="text-xl font-bold text-gray-800 mb-6 leading-relaxed">Đang tải câu hỏi...</h2>
                <div id="options-grid" class="grid grid-cols-1 gap-4">
                    <!-- Options -->
                </div>
            </div>
        </div>

        <!-- Result Section (Hidden by default) -->
        <div id="result-box" class="hidden bg-white rounded-2xl shadow-xl p-6 md:p-10 text-center fade-in">
            <h2 class="text-4xl font-bold text-blue-800 mb-4">Hoàn thành!</h2>
            <div class="text-6xl font-bold text-green-500 mb-6" id="final-score">0/20</div>
            <p id="result-message" class="text-lg text-gray-700 mb-8 font-medium"></p>
            <button onclick="restartQuiz()" class="bg-blue-600 text-white px-8 py-3 rounded-full font-bold hover:bg-blue-700 transition duration-300 transform hover:scale-105">
                Làm lại bài thi
            </button>
        </div>

        <!-- Footer Actions -->
        <div id="footer-actions" class="flex justify-between items-center px-2">
            <button id="hint-btn" class="text-blue-600 font-semibold hover:underline">Gợi ý 💡</button>
            <button id="next-btn" class="hidden bg-gray-800 text-white px-6 py-2 rounded-lg font-bold hover:bg-black transition">
                Câu tiếp theo &rarr;
            </button>
        </div>
    </div>

    <script>
        // Quiz Data - 20 Questions
        const quizData = [
            {
                q: "Ngành thực vật nào có cấu tạo đơn giản nhất, chưa có mạch dẫn và rễ thật?",
                options: ["Ngành Rêu", "Ngành Dương xỉ", "Ngành Hạt trần", "Ngành Hạt kín"],
                correct: 0,
                rationale: "Rêu là thực vật bậc thấp, chưa có mạch dẫn và rễ thật (chỉ có rễ giả)."
            },
            {
                q: "Đặc điểm đặc trưng nhất để nhận biết thực vật ngành Hạt kín là gì?",
                options: ["Có hoa và hạt nằm trong quả", "Có hạt nằm trên lá noãn hở", "Sinh sản bằng bào tử", "Có mạch dẫn"],
                correct: 0,
                rationale: "Hạt kín có hoa, quả bao bọc lấy hạt, giúp bảo vệ hạt tốt hơn."
            },
            {
                q: "Loài thực vật nào sau đây được coi là 'thuốc quý' trong tài liệu?",
                options: ["Cây tam thất", "Cây trúc đào", "Cây cà độc dược", "Cây thuốc phiện"],
                correct: 0,
                rationale: "Tam thất là cây thuốc quý có nhiều công dụng bồi bổ sức khỏe."
            },
            {
                q: "Tại sao nên trồng nhiều cây xanh ở các khu dân cư, đô thị?",
                options: ["Để điều hòa không khí và giảm ô nhiễm", "Để lấy gỗ xây dựng", "Để thu hút động vật hoang dã", "Để làm chất đốt"],
                correct: 0,
                rationale: "Cây xanh quang hợp hấp thụ CO2 và nhả O2, giúp không khí trong lành hơn."
            },
            {
                q: "Hành động nào gây hại cho đa dạng thực vật?",
                options: ["Phá rừng làm nương rẫy", "Trồng rừng phòng hộ", "Xây dựng vườn quốc gia", "Trồng cây xanh đô thị"],
                correct: 0,
                rationale: "Phá rừng làm mất đi môi trường sống của thực vật và động vật."
            },
            {
                q: "Nhóm nào dưới đây thuộc ngành Hạt trần?",
                options: ["Cây thông, cây vạn tuế", "Cây rêu, cây dương xỉ", "Cây lúa, cây ngô", "Cây nhãn, cây vải"],
                correct: 0,
                rationale: "Thông và vạn tuế sinh sản bằng hạt nhưng hạt nằm lộ trên lá noãn (nón)."
            },
            {
                q: "Động vật không xương sống nào có khả năng gây bệnh cho con người?",
                options: ["Giun đũa, giun kim", "San hô, thủy tức", "Trai sông, ốc sên", "Tôm, cua"],
                correct: 0,
                rationale: "Các loài giun sán ký sinh là nguyên nhân gây ra nhiều bệnh đường tiêu hóa."
            },
            {
                q: "Vai trò của thực vật đối với đất là gì?",
                options: ["Giữ đất, chống xói mòn", "Làm đất nhanh bạc màu", "Làm khô cằn đất", "Gây sạt lở đồi núi"],
                correct: 0,
                rationale: "Rễ cây và thảm mục giúp giữ đất, ngăn chặn dòng chảy mạnh gây xói mòn."
            },
            {
                q: "Khi đun nước bằng ấm điện, năng lượng điện đã chuyển hóa thành dạng năng lượng nào chủ yếu?",
                options: ["Nhiệt năng", "Cơ năng", "Hóa năng", "Quang năng"],
                correct: 0,
                rationale: "Dòng điện chạy qua dây điện trở làm nóng ấm và nước."
            },
            {
                q: "Dạng năng lượng nào được lưu trữ trong pin và thực phẩm?",
                options: ["Hóa năng", "Động năng", "Thế năng", "Điện năng"],
                correct: 0,
                rationale: "Hóa năng được giải phóng thông qua các phản ứng hóa học hoặc tiêu hóa."
            },
            {
                q: "Phát biểu nào SAI về bảo vệ giới thực vật?",
                options: ["Được phép khai thác gỗ quý không giới hạn", "Nghiêm cấm chặt phá rừng bừa bãi", "Tích cực trồng cây gây rừng", "Xây dựng các khu bảo tồn thiên nhiên"],
                correct: 0,
                rationale: "Khai thác gỗ quý không giới hạn sẽ làm cạn kiệt tài nguyên rừng."
            },
            {
                q: "Cây trúc đào có chứa chất độc gì ảnh hưởng đến con người?",
                options: ["Chất độc gây hại cho tim", "Chất gây ảo giác", "Chất gây liệt cơ", "Chất gây bỏng da"],
                correct: 0,
                rationale: "Lá và nhựa cây trúc đào chứa glycoside tim mạch rất độc."
            },
            {
                q: "Trong các nhóm sau, nhóm nào có mức độ tổ chức hoàn thiện nhất?",
                options: ["Lớp Thú", "Lớp Lưỡng cư", "Lớp Cá", "Lớp Bò sát"],
                correct: 0,
                rationale: "Thú là nhóm động vật có xương sống có tổ chức cơ thể phức tạp và hoàn thiện nhất."
            },
            {
                q: "Nguồn năng lượng nào sau đây là năng lượng tái tạo?",
                options: ["Năng lượng mặt trời", "Than đá", "Dầu mỏ", "Khí tự nhiên"],
                correct: 0,
                rationale: "Năng lượng mặt trời là nguồn vô tận và có thể tái tạo liên tục."
            },
            {
                q: "Cánh quạt gió quay để tạo ra điện là quá trình chuyển hóa nào?",
                options: ["Cơ năng sang Điện năng", "Nhiệt năng sang Điện năng", "Quang năng sang Cơ năng", "Điện năng sang Nhiệt năng"],
                correct: 0,
                rationale: "Sức gió làm quay tuabin (cơ năng) để máy phát điện tạo ra dòng điện."
            },
            {
                q: "Ngành Dương xỉ sinh sản bằng bộ phận nào?",
                options: ["Bào tử", "Hạt", "Hoa", "Rễ"],
                correct: 0,
                rationale: "Dương xỉ chưa có hoa và hạt, chúng sinh sản bằng các túi bào tử nằm dưới lá."
            },
            {
                q: "Động vật xương sống nào sau đây có da trần, ẩm ướt?",
                options: ["Ếch đồng", "Thằn lằn", "Cá chép", "Chim bồ câu"],
                correct: 0,
                rationale: "Lưỡng cư (như ếch) có da trần, luôn ẩm để hỗ trợ hô hấp qua da."
            },
            {
                q: "Sử dụng tiết kiệm năng lượng có lợi ích gì?",
                options: ["Bảo vệ môi trường và giảm chi phí", "Tăng lượng khí thải nhà kính", "Làm cạn kiệt tài nguyên nhanh hơn", "Không có lợi ích rõ rệt"],
                correct: 0,
                rationale: "Tiết kiệm năng lượng giúp giảm khai thác hóa thạch và bảo vệ hệ sinh thái."
            },
            {
                q: "Tại sao ở vùng đồi trọc hay xảy ra sạt lở khi mưa lớn?",
                options: ["Do thiếu thảm thực vật che chắn và giữ đất", "Do đất ở đó quá mềm", "Do mưa ở đồi trọc nặng hạt hơn", "Do không có cư dân sinh sống"],
                correct: 0,
                rationale: "Cây xanh giúp giảm tốc độ nước mưa rơi và rễ cây giữ chặt các lớp đất."
            },
            {
                q: "Thực vật Hạt kín khác Hạt trần ở đặc điểm quan trọng nào?",
                options: ["Có quả bảo vệ hạt", "Có mạch dẫn", "Có rễ, thân, lá thật", "Có khả năng quang hợp"],
                correct: 0,
                rationale: "Đây là bước tiến hóa giúp hạt được bảo vệ và phát tán hiệu quả hơn."
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let shuffledQuestions = [];
        let hasAnswered = false;

        // Utility: Shuffle Array
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // Initialize Quiz
        function initQuiz() {
            shuffledQuestions = shuffle([...quizData]).map(q => {
                const options = q.options.map((opt, i) => ({ text: opt, isCorrect: i === q.correct }));
                return { ...q, options: shuffle(options) };
            });
            showQuestion();
        }

        // Display Question
        function showQuestion() {
            hasAnswered = false;
            const q = shuffledQuestions[currentQuestion];
            
            // Update Progress
            document.getElementById('progress-fill').style.width = `${((currentQuestion) / shuffledQuestions.length) * 100}%`;
            document.getElementById('stats').innerText = `Câu ${currentQuestion + 1} / ${shuffledQuestions.length}`;
            document.getElementById('next-btn').classList.add('hidden');
            
            // Set Question Text
            const questionBox = document.getElementById('question-box');
            questionBox.classList.remove('fade-in');
            void questionBox.offsetWidth; // Trigger reflow
            questionBox.classList.add('fade-in');
            
            document.getElementById('question-text').innerText = q.q;
            
            // Render Options
            const optionsGrid = document.getElementById('options-grid');
            optionsGrid.innerHTML = '';
            
            q.options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = "option-card w-full text-left p-4 rounded-xl border-2 border-gray-200 transition-all duration-200 font-medium text-gray-700 flex items-start gap-3 bg-white";
                btn.innerHTML = `
                    <span class="bg-gray-100 px-2 py-0.5 rounded text-sm font-bold">${String.fromCharCode(65 + index)}</span>
                    <span>${option.text}</span>
                `;
                btn.onclick = () => selectOption(btn, option.isCorrect);
                optionsGrid.appendChild(btn);
            });

            document.getElementById('hint-btn').onclick = () => {
                alert("Gợi ý: " + q.rationale.split('.')[0] + "...");
            };
        }

        // Handle Option Selection
        function selectOption(element, isCorrect) {
            if (hasAnswered) return;
            hasAnswered = true;

            const q = shuffledQuestions[currentQuestion];
            const allBtns = document.querySelectorAll('.option-card');

            if (isCorrect) {
                element.classList.add('correct');
                score++;
            } else {
                element.classList.add('incorrect');
                // Show correct answer
                allBtns.forEach(btn => {
                    const btnText = btn.querySelector('span:last-child').innerText;
                    const correctOpt = q.options.find(o => o.isCorrect).text;
                    if (btnText === correctOpt) {
                        btn.classList.add('correct');
                    }
                });
            }

            // Show Rationale/Feedback
            const feedback = document.createElement('div');
            feedback.className = "mt-6 p-4 rounded-lg bg-blue-50 border border-blue-200 text-blue-800 text-sm italic fade-in";
            feedback.innerHTML = `<strong>Giải thích:</strong> ${q.rationale}`;
            document.getElementById('question-box').appendChild(feedback);

            document.getElementById('next-btn').classList.remove('hidden');
            if (currentQuestion === shuffledQuestions.length - 1) {
                document.getElementById('next-btn').innerText = "Xem kết quả";
            }
        }

        // Handle Next Button
        document.getElementById('next-btn').onclick = () => {
            if (currentQuestion < shuffledQuestions.length - 1) {
                currentQuestion++;
                showQuestion();
            } else {
                showResult();
            }
        };

        // Show Final Result
        function showResult() {
            document.getElementById('quiz-container').classList.add('hidden');
            document.getElementById('footer-actions').classList.add('hidden');
            document.getElementById('result-box').classList.remove('hidden');
            document.getElementById('progress-fill').style.width = "100%";
            
            const scoreDisplay = document.getElementById('final-score');
            scoreDisplay.innerText = `${score} / ${shuffledQuestions.length}`;
            
            const msg = document.getElementById('result-message');
            const percent = (score / shuffledQuestions.length) * 100;
            if (percent === 100) msg.innerText = "Tuyệt vời! Bạn đã nắm vững toàn bộ kiến thức.";
            else if (percent >= 80) msg.innerText = "Rất tốt! Bạn có nền tảng kiến thức rất vững chắc.";
            else if (percent >= 50) msg.innerText = "Khá tốt. Hãy ôn tập thêm các câu sai nhé.";
            else msg.innerText = "Bạn cần xem lại tài liệu kỹ hơn để nắm bắt kiến thức.";
        }

        // Restart
        function restartQuiz() {
            currentQuestion = 0;
            score = 0;
            document.getElementById('quiz-container').classList.remove('hidden');
            document.getElementById('footer-actions').classList.remove('hidden');
            document.getElementById('result-box').classList.add('hidden');
            document.getElementById('next-btn').innerText = "Câu tiếp theo →";
            initQuiz();
        }

        // Start on load
        window.onload = initQuiz;
    </script>
</body>
</html>
