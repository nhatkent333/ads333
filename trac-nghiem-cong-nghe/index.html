<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ôn Tập Công Nghệ 7 - Đề Cương Giữa Kì I</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #059669;
      --primary-light: #10b981;
      --primary-subtle: #ecfdf5;
      --success: #10b981;
      --success-subtle: #ecfdf5;
      --error: #ef4444;
      --error-subtle: #fef2f2;
      --warning: #f59e0b;
      --warning-subtle: #fffbeb;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --radius: 14px;
      --radius-sm: 8px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
      --shadow-md: 0 4px 12px -2px rgba(0,0,0,0.08);
      --font-main: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-title: 'Plus Jakarta Sans', sans-serif;
    }

    [data-theme="dark"] {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --primary: #10b981;
      --primary-subtle: #064e3b;
      --success-subtle: #064e3b;
      --error-subtle: #7f1d1d;
      --warning-subtle: #78350f;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: var(--font-main);
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.55;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: background-color 0.2s ease, color 0.2s ease;
      padding-bottom: 5rem;
    }

    /* Single Column Mobile-First Container */
    .app-container {
      width: 100%;
      max-width: 680px;
      padding: 0 0.85rem;
      margin: 0 auto;
    }

    /* App Header */
    header {
      width: 100%;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 40;
      backdrop-filter: blur(10px);
      box-shadow: var(--shadow-sm);
    }

    .header-content {
      max-width: 680px;
      margin: 0 auto;
      padding: 0.75rem 0.85rem 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .brand-badge {
      background: linear-gradient(135deg, #059669, #0d9488);
      color: white;
      font-weight: 800;
      font-size: 0.82rem;
      padding: 0.25rem 0.6rem;
      border-radius: var(--radius-sm);
      letter-spacing: 0.5px;
    }

    .brand-text h1 {
      font-family: var(--font-title);
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.25;
    }

    .brand-text p {
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    .header-btns {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .btn-icon {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-icon:active {
      transform: scale(0.92);
    }

    /* Actions & Quick Shuffles */
    .action-bar {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 0.45rem;
    }

    .btn-action {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      padding: 0.5rem 0.75rem;
      border-radius: 10px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .btn-action:active {
      transform: scale(0.96);
    }

    .btn-action.primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: white;
      border-color: transparent;
      box-shadow: 0 2px 8px rgba(5, 150, 105, 0.25);
    }

    /* Tabs Filter Bar (Horizontal scroll) */
    .tabs-wrapper {
      display: flex;
      gap: 0.35rem;
      overflow-x: auto;
      padding-bottom: 0.25rem;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .tabs-wrapper::-webkit-scrollbar {
      display: none;
    }

    .tab-item {
      padding: 0.35rem 0.75rem;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text-muted);
      font-size: 0.78rem;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .tab-item.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    /* Sticky Progress Bar */
    .progress-bar-container {
      width: 100%;
      height: 4px;
      background: var(--border);
      position: relative;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #059669, #10b981);
      width: 0%;
      transition: width 0.3s ease;
    }

    /* Scoreboard Summary Card */
    .score-summary {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.85rem 1rem;
      margin-top: 0.85rem;
      display: flex;
      align-items: center;
      justify-content: space-around;
      box-shadow: var(--shadow-sm);
    }

    .score-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .score-num {
      font-family: var(--font-title);
      font-size: 1.25rem;
      font-weight: 800;
      line-height: 1.1;
    }

    .score-label {
      font-size: 0.7rem;
      color: var(--text-muted);
      font-weight: 600;
      margin-top: 0.15rem;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    /* Question List & Cards */
    .questions-stream {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-top: 0.85rem;
    }

    .q-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.15rem 1rem 1rem;
      box-shadow: var(--shadow-sm);
      position: relative;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .q-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.65rem;
    }

    .q-badge-group {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .q-num-tag {
      background: var(--primary-subtle);
      color: var(--primary);
      font-family: var(--font-title);
      font-weight: 800;
      font-size: 0.78rem;
      padding: 0.2rem 0.55rem;
      border-radius: 6px;
    }

    .q-type-tag {
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .btn-bookmark {
      background: transparent;
      border: none;
      font-size: 1.15rem;
      color: var(--text-muted);
      cursor: pointer;
      line-height: 1;
      padding: 0.2rem;
    }

    .btn-bookmark.active {
      color: var(--warning);
    }

    .q-text {
      font-size: 0.98rem;
      font-weight: 600;
      color: var(--text);
      line-height: 1.5;
      margin-bottom: 0.9rem;
    }

    /* Mobile First Tap Options */
    .options-col {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
    }

    .opt-btn {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 0.85rem;
      border-radius: var(--radius-sm);
      border: 1.5px solid var(--border);
      background: var(--card-bg);
      cursor: pointer;
      text-align: left;
      transition: all 0.15s ease;
      user-select: none;
      position: relative;
    }

    .opt-btn:active {
      transform: scale(0.98);
      background: var(--bg);
    }

    .opt-letter {
      width: 28px;
      height: 28px;
      min-width: 28px;
      border-radius: 6px;
      background: var(--bg);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-title);
      font-weight: 700;
      font-size: 0.82rem;
      color: var(--text-muted);
      transition: all 0.15s;
    }

    .opt-content {
      font-size: 0.91rem;
      line-height: 1.45;
      flex: 1;
    }

    /* Feedback states */
    .opt-btn.is-correct {
      border-color: var(--success) !important;
      background: var(--success-subtle) !important;
    }
    .opt-btn.is-correct .opt-letter {
      background: var(--success) !important;
      color: white !important;
      border-color: var(--success) !important;
    }

    .opt-btn.is-wrong {
      border-color: var(--error) !important;
      background: var(--error-subtle) !important;
    }
    .opt-btn.is-wrong .opt-letter {
      background: var(--error) !important;
      color: white !important;
      border-color: var(--error) !important;
    }

    .opt-feedback-icon {
      font-size: 1rem;
      font-weight: 800;
      margin-left: auto;
    }

    /* True/False Statements */
    .tf-choice-row {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.65rem;
    }

    .tf-btn {
      flex: 1;
      padding: 0.65rem 0.5rem;
      border-radius: 8px;
      border: 1.5px solid var(--border);
      background: var(--card-bg);
      font-family: var(--font-title);
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      color: var(--text-muted);
      transition: all 0.15s ease;
    }

    .tf-btn:active {
      transform: scale(0.97);
    }

    .tf-btn.correct-choice {
      background: var(--success) !important;
      color: white !important;
      border-color: var(--success) !important;
    }

    .tf-btn.wrong-choice {
      background: var(--error) !important;
      color: white !important;
      border-color: var(--error) !important;
    }

    /* Explanation Collapsible */
    .explanation-panel {
      margin-top: 0.85rem;
      padding: 0.75rem 0.85rem;
      border-radius: var(--radius-sm);
      background: var(--bg);
      border: 1px dashed var(--border);
      font-size: 0.85rem;
      line-height: 1.55;
      color: var(--text-muted);
      display: none;
      animation: fadeIn 0.2s ease;
    }

    .explanation-panel.visible {
      display: block;
    }

    .explanation-panel strong {
      color: var(--text);
      display: block;
      margin-bottom: 0.25rem;
    }

    /* Essay Cards */
    .essay-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.15rem 1rem;
      box-shadow: var(--shadow-sm);
    }

    .essay-card-header {
      display: flex;
      align-items: flex-start;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }

    .essay-tag {
      background: #059669;
      color: white;
      font-size: 0.72rem;
      font-weight: 800;
      padding: 0.2rem 0.55rem;
      border-radius: 6px;
      white-space: nowrap;
    }

    .essay-title {
      font-size: 0.95rem;
      font-weight: 700;
      line-height: 1.5;
    }

    .essay-hint-btn {
      width: 100%;
      padding: 0.55rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--primary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      margin-top: 0.65rem;
    }

    .essay-answer-box {
      margin-top: 0.75rem;
      padding: 0.85rem;
      background: var(--bg);
      border-radius: var(--radius-sm);
      border-left: 3px solid #059669;
      font-size: 0.88rem;
      line-height: 1.6;
      display: none;
    }

    .essay-answer-box.open {
      display: block;
      animation: fadeIn 0.2s ease;
    }

    .essay-answer-box ul {
      padding-left: 1.15rem;
      margin-top: 0.4rem;
    }

    .essay-answer-box li {
      margin-bottom: 0.35rem;
    }

    /* Drawer */
    .drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(3px);
      z-index: 100;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .drawer-overlay.active {
      display: flex;
      animation: fadeIn 0.2s ease;
    }

    .drawer-content {
      background: var(--card-bg);
      width: 100%;
      max-width: 680px;
      border-radius: 20px 20px 0 0;
      padding: 1.25rem 1rem 2rem;
      box-shadow: var(--shadow-md);
      max-height: 75vh;
      overflow-y: auto;
      animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .drawer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border);
    }

    .drawer-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 0.45rem;
    }

    .grid-cell {
      aspect-ratio: 1;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text-muted);
      font-family: var(--font-title);
      font-weight: 700;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
    }

    .grid-cell.cell-correct {
      background: var(--success);
      color: white;
      border-color: var(--success);
    }

    .grid-cell.cell-wrong {
      background: var(--error);
      color: white;
      border-color: var(--error);
    }

    .grid-cell.cell-flagged::after {
      content: '★';
      position: absolute;
      top: 2px;
      right: 2px;
      font-size: 0.55rem;
      color: var(--warning);
    }

    /* Floating Toast */
    .toast {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--text);
      color: var(--card-bg);
      padding: 0.6rem 1.1rem;
      border-radius: 25px;
      font-size: 0.82rem;
      font-weight: 600;
      box-shadow: var(--shadow-md);
      z-index: 120;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      white-space: nowrap;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- Sticky Header -->
  <header>
    <div class="header-content">
      <div class="header-top">
        <div class="brand-title">
          <span class="brand-badge">CÔNG NGHỆ 7</span>
          <div class="brand-text">
            <h1>Ôn Tập Đề Cương Giữa Kì I</h1>
            <p>Trắc nghiệm phản hồi tức thì • Mobile First</p>
          </div>
        </div>
        <div class="header-btns">
          <button id="themeToggle" class="btn-icon" title="Đổi màu nền sáng/tối">🌓</button>
          <button id="btnOpenGrid" class="btn-icon" title="Mở danh sách câu hỏi">📋</button>
        </div>
      </div>

      <!-- Quick Action Buttons -->
      <div class="action-bar">
        <button id="btnShuffleAll" class="btn-action primary" title="Xáo trộn ngẫu nhiên thứ tự câu hỏi và phương án">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.7-1.1 2-1.7 3.3-1.7H22"></path><path d="m18 2 4 4-4 4"></path><path d="M2 6h1.9c1.5 0 2.9.9 3.6 2.2"></path><path d="M22 18h-5.9c-1.3 0-2.5-.7-3.3-1.8l-.5-.8"></path><path d="m18 14 4 4-4 4"></path></svg>
          Đảo Câu & Đáp Án
        </button>
        <button id="btnResetAll" class="btn-action" title="Làm lại tất cả câu hỏi">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>
          Làm Lại
        </button>
        <button id="btnRestoreOriginal" class="btn-action" title="Khôi phục thứ tự nguyên bản theo đề cương giấy">
          Thứ tự gốc
        </button>
      </div>

      <!-- Category Filter Tabs -->
      <div class="tabs-wrapper">
        <button class="tab-item active" data-filter="all">Tất cả (32 câu)</button>
        <button class="tab-item" data-filter="part1">Phần I: 4 Lựa chọn (24 câu)</button>
        <button class="tab-item" data-filter="part2">Phần II: Đúng / Sai (8 câu)</button>
        <button class="tab-item" data-filter="part3">Phần III: Tự Luận (3 câu)</button>
      </div>
    </div>

    <!-- Progress indicator bar -->
    <div class="progress-bar-container">
      <div class="progress-bar-fill" id="progressBar"></div>
    </div>
  </header>

  <!-- Main Single Column App Container -->
  <main class="app-container">
    <!-- Score Summary Counter -->
    <div class="score-summary">
      <div class="score-item">
        <span class="score-num" id="statCompleted">0/32</span>
        <span class="score-label">Đã ôn tập</span>
      </div>
      <div class="score-item">
        <span class="score-num" style="color: var(--success);" id="statCorrect">0</span>
        <span class="score-label">Trả lời đúng</span>
      </div>
      <div class="score-item">
        <span class="score-num" style="color: var(--error);" id="statWrong">0</span>
        <span class="score-label">Cần xem lại</span>
      </div>
      <div class="score-item">
        <span class="score-num" style="color: var(--primary);" id="statPercentage">0%</span>
        <span class="score-label">Tỷ lệ đúng</span>
      </div>
    </div>

    <!-- Questions Stream -->
    <div id="questionsStream" class="questions-stream">
      <!-- Injected by JavaScript -->
    </div>

    <!-- Essay Stream -->
    <div id="essayStream" class="questions-stream" style="display: none;">
      <!-- Injected by JavaScript -->
    </div>
  </main>

  <!-- Question Quick Jump Drawer (Mobile Bottom Sheet) -->
  <div class="drawer-overlay" id="gridDrawer">
    <div class="drawer-content">
      <div class="drawer-header">
        <div style="font-family: var(--font-title); font-weight: 700; font-size: 1rem;">Mục Lục 32 Câu Hỏi</div>
        <button class="btn-icon" id="btnCloseDrawer">✕</button>
      </div>
      <div class="drawer-grid" id="drawerGrid">
        <!-- Rendered by JavaScript -->
      </div>
      <div style="display: flex; gap: 0.8rem; margin-top: 1rem; font-size: 0.75rem; color: var(--text-muted); flex-wrap: wrap;">
        <span style="display: inline-flex; align-items: center; gap: 0.3rem;"><span style="width: 10px; height: 10px; background: var(--success); border-radius: 2px;"></span> Đúng</span>
        <span style="display: inline-flex; align-items: center; gap: 0.3rem;"><span style="width: 10px; height: 10px; background: var(--error); border-radius: 2px;"></span> Sai</span>
        <span style="display: inline-flex; align-items: center; gap: 0.3rem;"><span style="width: 10px; height: 10px; background: var(--bg); border: 1px solid var(--border); border-radius: 2px;"></span> Chưa làm</span>
        <span style="display: inline-flex; align-items: center; gap: 0.3rem;">★ Đánh dấu</span>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div class="toast" id="toastMessage">Đã đảo thứ tự câu hỏi và phương án!</div>

  <!-- Application Script -->
  <script>
    /* ==========================================================================
       1. DATA DEFINITIONS - CÔNG NGHỆ 7 (PAGES 1 - 4)
       ========================================================================== */
    const RAW_QUESTIONS = [

    /* ==========================================================================
       3. MOBILE FIRST CONTROLLER FOR CÔNG NGHỆ 7
       ========================================================================== */
    class CongNgheQuizApp {
      constructor() {
        this.questions = [];
        this.userAnswers = {}; // { qId: key } or { qId: bool }
        this.flagged = new Set();
        this.filter = 'all';

        this.init();
      }

      init() {
        this.loadQuestions(true);
        this.bindEvents();
        this.render();
      }

      shuffle(arr) {
        const copy = [...arr];
        for (let i = copy.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
      }

      loadQuestions(doShuffle = true) {
        let list = JSON.parse(JSON.stringify(RAW_QUESTIONS));

        if (doShuffle) {
          list = this.shuffle(list);
          list = list.map(q => {
            if (q.type === 'single' && Array.isArray(q.options)) {
              const shuffledOpts = this.shuffle(q.options);
              const letters = ['A', 'B', 'C', 'D'];
              q.options = shuffledOpts.map((opt, i) => ({
                ...opt,
                key: letters[i] || opt.key
              }));
            }
            return q;
          });
        }

        this.questions = list;
        this.userAnswers = {};
        this.updateStats();
      }

      bindEvents() {
        document.getElementById('themeToggle').addEventListener('click', () => {
          const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
          document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
        });

        document.querySelectorAll('.tab-item').forEach(btn => {
          btn.addEventListener('click', () => {
            document.querySelectorAll('.tab-item').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            this.filter = btn.dataset.filter;
            this.render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
          });
        });

        document.getElementById('btnShuffleAll').addEventListener('click', () => {
          this.loadQuestions(true);
          this.render();
          this.showToast("Đã đảo thứ tự 32 câu và các đáp án A, B, C, D!");
        });

        document.getElementById('btnResetAll').addEventListener('click', () => {
          if (confirm("Làm lại tất cả câu hỏi ôn tập?")) {
            this.userAnswers = {};
            this.render();
            this.showToast("Đã làm mới dữ liệu ôn tập!");
          }
        });

        document.getElementById('btnRestoreOriginal').addEventListener('click', () => {
          this.questions = JSON.parse(JSON.stringify(RAW_QUESTIONS));
          this.userAnswers = {};
          this.render();
          this.showToast("Đã phục hồi đúng thứ tự gốc theo đề cương giấy!");
        });

        document.getElementById('btnOpenGrid').addEventListener('click', () => {
          this.renderDrawerGrid();
          document.getElementById('gridDrawer').classList.add('active');
        });

        document.getElementById('btnCloseDrawer').addEventListener('click', () => {
          document.getElementById('gridDrawer').classList.remove('active');
        });

        document.getElementById('gridDrawer').addEventListener('click', (e) => {
          if (e.target.id === 'gridDrawer') {
            document.getElementById('gridDrawer').classList.remove('active');
          }
        });
      }

      showToast(text) {
        const toast = document.getElementById('toastMessage');
        toast.textContent = text;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2400);
      }

      selectOption(qId, key) {
        this.userAnswers[qId] = key;
        this.updateQuestionCard(qId);
        this.updateStats();
      }

      selectTF(qId, val) {
        this.userAnswers[qId] = val;
        this.updateQuestionCard(qId);
        this.updateStats();
      }

      toggleBookmark(qId) {
        if (this.flagged.has(qId)) {
          this.flagged.delete(qId);
        } else {
          this.flagged.add(qId);
        }
        const card = document.getElementById(`card-${qId}`);
        if (card) {
          const btn = card.querySelector('.btn-bookmark');
          if (btn) btn.classList.toggle('active', this.flagged.has(qId));
        }
      }

      updateStats() {
        let completed = 0;
        let correct = 0;
        let wrong = 0;

        this.questions.forEach(q => {
          const ans = this.userAnswers[q.id];
          if (ans !== undefined) {
            completed++;
            if (q.type === 'single') {
              const isRight = q.options.find(o => o.key === ans)?.isCorrect;
              if (isRight) correct++; else wrong++;
            } else if (q.type === 'tf-item') {
              if (ans === q.isCorrect) correct++; else wrong++;
            }
          }
        });

        const total = this.questions.length;
        document.getElementById('statCompleted').textContent = `${completed}/${total}`;
        document.getElementById('statCorrect').textContent = correct;
        document.getElementById('statWrong').textContent = wrong;

        const pct = completed > 0 ? Math.round((correct / completed) * 100) : 0;
        document.getElementById('statPercentage').textContent = `${pct}%`;

        const progressPct = Math.round((completed / total) * 100);
        document.getElementById('progressBar').style.width = `${progressPct}%`;
      }

      render() {
        const qContainer = document.getElementById('questionsStream');
        const essayContainer = document.getElementById('essayStream');

        if (this.filter === 'part3') {
          qContainer.style.display = 'none';
          essayContainer.style.display = 'flex';
          this.renderEssays();
          return;
        }

        qContainer.style.display = 'flex';
        essayContainer.style.display = 'none';

        let list = this.questions;
        if (this.filter === 'part1') list = this.questions.filter(q => q.part === 1);
        if (this.filter === 'part2') list = this.questions.filter(q => q.part === 2);

        qContainer.innerHTML = list.map((q, idx) => this.generateCardHTML(q, idx + 1)).join('');
        this.updateStats();
      }

      updateQuestionCard(qId) {
        const q = this.questions.find(x => x.id === qId);
        if (!q) return;
        const card = document.getElementById(`card-${qId}`);
        if (!card) return;
        const curIdx = card.querySelector('.q-num-tag')?.dataset?.index || q.id;
        card.outerHTML = this.generateCardHTML(q, curIdx);
      }

      generateCardHTML(q, displayIdx) {
        const isFlag = this.flagged.has(q.id);

        let bodyHTML = '';
        let hasAnswered = this.userAnswers[q.id] !== undefined;

        if (q.type === 'single') {
          const userChoice = this.userAnswers[q.id];

          bodyHTML = `
            <div class="options-col">
              ${q.options.map(opt => {
                let classes = 'opt-btn';
                let icon = '';

                if (hasAnswered) {
                  if (opt.isCorrect) {
                    classes += ' is-correct';
                    icon = `<span class="opt-feedback-icon" style="color: var(--success);">✓</span>`;
                  } else if (userChoice === opt.key && !opt.isCorrect) {
                    classes += ' is-wrong';
                    icon = `<span class="opt-feedback-icon" style="color: var(--error);">✗</span>`;
                  }
                }

                return `
                  <div class="${classes}" onclick="app.selectOption(${q.id}, '${opt.key}')">
                    <div class="opt-letter">${opt.key}</div>
                    <div class="opt-content">${opt.text}</div>
                    ${icon}
                  </div>
                `;
              }).join('')}
            </div>
          `;
        } else if (q.type === 'tf-item') {
          const userVal = this.userAnswers[q.id];

          let tClasses = 'tf-btn';
          let fClasses = 'tf-btn';

          if (hasAnswered) {
            if (q.isCorrect === true) tClasses += ' correct-choice';
            else fClasses += ' correct-choice';

            if (userVal === true && !q.isCorrect) tClasses += ' wrong-choice';
            if (userVal === false && q.isCorrect) fClasses += ' wrong-choice';
          }

          bodyHTML = `
            <div class="tf-choice-row">
              <button class="${tClasses}" onclick="app.selectTF(${q.id}, true)">
                Đúng (Đ) ${hasAnswered && q.isCorrect === true ? '✓' : ''}
              </button>
              <button class="${fClasses}" onclick="app.selectTF(${q.id}, false)">
                Sai (S) ${hasAnswered && q.isCorrect === false ? '✓' : ''}
              </button>
            </div>
          `;
        }

        return `
          <div class="q-card" id="card-${q.id}">
            <div class="q-top">
              <div class="q-badge-group">
                <span class="q-num-tag" data-index="${displayIdx}">Câu ${displayIdx}</span>
                <span class="q-type-tag">${q.type === 'single' ? '4 Lựa chọn' : 'Đúng / Sai'}</span>
              </div>
              <button class="btn-bookmark ${isFlag ? 'active' : ''}" onclick="app.toggleBookmark(${q.id})" title="Đánh dấu câu này">
                ${isFlag ? '★' : '☆'}
              </button>
            </div>

            <div class="q-text">${q.title}</div>
            ${bodyHTML}

            <div class="explanation-panel ${hasAnswered ? 'visible' : ''}">
              <strong>💡 Giải thích chi tiết:</strong>
              ${q.explanation}
            </div>
          </div>
        `;
      }

      renderEssays() {
        const stream = document.getElementById('essayStream');
        stream.innerHTML = RAW_ESSAYS.map(e => `
          <div class="essay-card">
            <div class="essay-card-header">
              <span class="essay-tag">${e.num}</span>
              <div class="essay-title">${e.question}</div>
            </div>

            <button class="essay-hint-btn" onclick="this.nextElementSibling.classList.toggle('open')">
              📖 Xem gợi ý đáp án chi tiết
            </button>
            <div class="essay-answer-box">
              ${e.subQuestions ? e.subQuestions.map(sq => `
                <div style="margin-top: 0.6rem; padding-top: 0.6rem; border-top: 1px dashed var(--border);">
                  <strong style="color: var(--text);">${sq.part}</strong>
                  <div style="margin-top: 0.25rem;">${sq.hint}</div>
                </div>
              `).join('') : ''}
            </div>
          </div>
        `).join('');
      }

      renderDrawerGrid() {
        const grid = document.getElementById('drawerGrid');
        grid.innerHTML = this.questions.map((q, i) => {
          let classes = 'grid-cell';
          if (this.flagged.has(q.id)) classes += ' cell-flagged';

          const ans = this.userAnswers[q.id];
          if (ans !== undefined) {
            if (q.type === 'single') {
              const isRight = q.options.find(o => o.key === ans)?.isCorrect;
              classes += isRight ? ' cell-correct' : ' cell-wrong';
            } else if (q.type === 'tf-item') {
              classes += ans === q.isCorrect ? ' cell-correct' : ' cell-wrong';
            }
          }

          return `
            <button class="${classes}" onclick="app.jumpToQuestion(${q.id})">
              ${i + 1}
            </button>
          `;
        }).join('');
      }

      jumpToQuestion(qId) {
        document.getElementById('gridDrawer').classList.remove('active');
        if (this.filter === 'part3') {
          document.querySelectorAll('.tab-item').forEach(b => b.classList.remove('active'));
          document.querySelector('.tab-item[data-filter="all"]').classList.add('active');
          this.filter = 'all';
          this.render();
        }

        setTimeout(() => {
          const el = document.getElementById(`card-${qId}`);
          if (el) {
            el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            el.style.borderColor = 'var(--primary)';
            setTimeout(() => el.style.borderColor = '', 1200);
          }
        }, 80);
      }
    }

    let app;
    window.addEventListener('DOMContentLoaded', () => {
      app = new CongNgheQuizApp();
    });
  </script>
</body>
</html>
