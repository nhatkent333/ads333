<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>So Sánh Giọng Đọc Gốc và Giọng Đọc Clone</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
      padding: 40px 20px;
      line-height: 1.5;
    }
    .container {
      max-width: 860px;
      margin: 0 auto;
      background: #ffffff;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
      border: 1px solid #e2e8f0;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
      text-align: center;
      color: #0f172a;
    }
    p.subtitle {
      text-align: center;
      color: #64748b;
      margin-bottom: 30px;
      font-size: 15px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      padding: 18px 20px;
      text-align: left;
      border-bottom: 1px solid #e2e8f0;
      vertical-align: middle;
    }
    th {
      background-color: #f1f5f9;
      font-weight: 600;
      color: #334155;
      font-size: 15px;
    }
    th:first-child, td:first-child {
      width: 14%;
      text-align: center;
      font-weight: 600;
      color: #64748b;
    }
    th:nth-child(2), td:nth-child(2) {
      width: 43%;
      border-right: 1px solid #e2e8f0;
    }
    th:nth-child(3), td:nth-child(3) {
      width: 43%;
    }
    .file-name {
      display: block;
      font-size: 13px;
      color: #64748b;
      margin-bottom: 8px;
      font-family: monospace;
    }
    audio {
      width: 100%;
      height: 40px;
      outline: none;
    }
    .tag {
      display: inline-block;
      font-size: 12px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 4px;
      margin-bottom: 6px;
    }
    .tag-orig {
      background: #eff6ff;
      color: #2563eb;
    }
    .tag-clone {
      background: #faf5ff;
      color: #7c3aed;
    }
    @media (max-width: 600px) {
      body {
        padding: 15px 10px;
      }
      .container {
        padding: 20px 14px;
      }
      th, td {
        padding: 12px 8px;
      }
      th:first-child, td:first-child {
        display: none;
      }
      th:nth-child(2), td:nth-child(2) {
        width: 50%;
      }
      th:nth-child(3), td:nth-child(3) {
        width: 50%;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Bảng So Sánh Giọng Đọc</h1>
    <p class="subtitle">So sánh trực tiếp giữa Giọng đọc gốc và Giọng đọc AI clone</p>

    <table>
      <thead>
        <tr>
          <th>STT</th>
          <th>Giọng đọc gốc (Original)</th>
          <th>Giọng đọc clone (AI)</th>
        </tr>
      </thead>
      <tbody>
        <!-- VÍ DỤ 1 -->
        <tr>
          <td>Ví dụ 1</td>
          <td>
            <span class="tag tag-orig">Bản gốc</span>
            <span class="file-name">original.m4a</span>
            <audio controls preload="metadata">
              <source src="original.m4a" type="audio/mp4">
              Trình duyệt không hỗ trợ audio.
            </audio>
          </td>
          <td>
            <span class="tag tag-clone">AI Clone</span>
            <span class="file-name">clone.wav</span>
            <audio controls preload="metadata">
              <source src="clone.wav" type="audio/wav">
              Trình duyệt không hỗ trợ audio.
            </audio>
          </td>
        </tr>

        <!-- VÍ DỤ 2 -->
        <tr>
          <td>Ví dụ 2</td>
          <td>
            <span class="tag tag-orig">Bản gốc</span>
            <span class="file-name">original_2.m4a</span>
            <audio controls preload="metadata">
              <source src="original_2.m4a" type="audio/mp4">
              Trình duyệt không hỗ trợ audio.
            </audio>
          </td>
          <td>
            <span class="tag tag-clone">AI Clone</span>
            <span class="file-name">clone_2.wav</span>
            <audio controls preload="metadata">
              <source src="clone_2.wav" type="audio/wav">
              Trình duyệt không hỗ trợ audio.
            </audio>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

</body>
</html>
